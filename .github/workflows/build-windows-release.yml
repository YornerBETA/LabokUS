name: Build Kolobok Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows app
        shell: pwsh
        run: |
          cd 1.1.0/W/x64/ru/all
          python -m pip install --upgrade pip pyinstaller pyttsx3
          pyinstaller --noconfirm --clean --windowed --name Kolobok --hidden-import=pyttsx3 app/main.py
          New-Item -ItemType Directory -Force -Path package/Kolobok/dist | Out-Null
          Copy-Item -Recurse dist/Kolobok package/Kolobok/dist/
          Copy-Item manifest.json,run.bat,install.bat,requirements.txt package/Kolobok/
          Compress-Archive -Path package/Kolobok -DestinationPath "$env:GITHUB_WORKSPACE/LabokUS-1.1.0-W-x64-ru-all.zip"
          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE/LabokUS-1.1.0-W-x64-ru-all.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  LabokUS-1.1.0-W-x64-ru-all.zip" | Out-File "$env:GITHUB_WORKSPACE/LabokUS-1.1.0-W-x64-ru-all.zip.sha256" -Encoding ascii
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LabokUS-1.1.0-W-x64-ru-all.zip
            LabokUS-1.1.0-W-x64-ru-all.zip.sha256
