name: Build Kolobok Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --windowed --name Kolobok 1.0.0/W/Russian/app/main.py
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Kolobok -DestinationPath Kolobok-Windows-x64.zip
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kolobok-Windows-x64.zip
