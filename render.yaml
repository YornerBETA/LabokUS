services:
  - type: web
    name: kolobok-labokus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: AGENT_EVENT_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: openai-compatible
      - key: DATABASE_PATH
        value: data/kolobok.db
